<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>洁洁😖 · 温柔提醒</title>

<style>
:root{
  --bg:            #eef0f4;
  --title-blue:    #7f9be0;
  --sub-gray:      #9aa0a6;
  --btn-border:    #c9cf4d;
  --card-glow:     rgba(243, 148, 173, .42);
  --card-radius:   12px;
  --ink:           #1f1f1f;
  --head-ink:      #6b6b6b;
}

*{
  margin:0; padding:0; box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%; height:100%;
  overflow:hidden;
}

body{
  background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
              "Noto Sans SC",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  user-select:none;
  -webkit-user-select:none;
}

::-webkit-scrollbar{ width:0; height:0; }

.screen{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  transition:opacity .9s ease, visibility .9s ease;
}
.screen.hidden{
  opacity:0; visibility:hidden; pointer-events:none;
}

#startScreen{
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 60%),
    var(--bg);
  z-index:100;
}

#startTitle{
  font-size:clamp(30px, 6.4vw, 42px);
  font-weight:800;
  color:var(--title-blue);
  letter-spacing:2px;
  text-align:center;
  padding:0 24px;
  animation:titleIn .9s cubic-bezier(.2,.9,.3,1.2) both;
}

#startSubtitle{
  margin-top:26px;
  font-size:clamp(15px, 3.6vw, 22px);
  color:var(--sub-gray);
  text-align:center;
  line-height:1.8;
  max-width:78%;
  animation:fadeUp .9s .18s ease both;
}

#startBtn{
  margin-top:56px;
  padding:15px 46px;
  font-size:clamp(17px, 4vw, 21px);
  font-weight:800;
  letter-spacing:3px;
  color:var(--title-blue);
  background:rgba(255,255,255,.6);
  border:2px solid var(--btn-border);
  border-radius:999px;
  cursor:pointer;
  outline:none;
  transition:transform .18s ease, box-shadow .25s ease, background .25s ease;
  animation:fadeUp .9s .34s ease both;
}
#startBtn:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 10px 26px rgba(201,207,77,.35);
  background:#fff;
}
#startBtn:active{ transform:translateY(1px) scale(.97); }
#startBtn.disabled{ pointer-events:none; opacity:.55; }

@keyframes titleIn{
  from{ opacity:0; transform:translateY(26px) scale(.92); }
  to  { opacity:1; transform:translateY(0)    scale(1);   }
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(18px); }
  to  { opacity:1; transform:translateY(0); }
}

#stage{
  background:
    radial-gradient(130% 100% at 50% 0%, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(120% 120% at 50% 110%, rgba(214,219,232,.55) 0%, rgba(255,255,255,0) 60%),
    var(--bg);
  z-index:10;
  display:block;
}

#cardLayer{
  position:absolute; inset:0;
  overflow:hidden;
}

#glowBurst{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle,
              rgba(255,158,188,.55) 0%,
              rgba(255,158,188,.26) 42%,
              rgba(255,158,188,0)   72%);
  opacity:0;
  transform:scale(.2);
  pointer-events:none;
  z-index:0;
  will-change:transform,opacity;
}
#glowBurst.on{ animation:burst 1.1s cubic-bezier(.16,.8,.3,1) forwards; }
@keyframes burst{
  0%  { opacity:0;  transform:scale(.2); }
  20% { opacity:.9; }
  100%{ opacity:0;  transform:scale(2.2); }
}

.heart-spark{
  position:absolute;
  font-size:18px;
  pointer-events:none;
  z-index:999;
  opacity:0;
  will-change:transform,opacity;
  animation:spark 1s cubic-bezier(.2,.7,.4,1) forwards;
}
@keyframes spark{
  0%  { opacity:0; transform:translate(0,0) scale(.4); }
  18% { opacity:1; }
  100%{ opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.2); }
}

.card{
  position:absolute; left:0; top:0;
  will-change:transform;
  transition:transform var(--fly-dur,850ms)
             cubic-bezier(.18,.82,.24,1)
             var(--fly-delay,0ms);
}

.card-inner{
  width:100%; height:100%;
  display:flex; flex-direction:column;
  border-radius:var(--card-radius);
  overflow:hidden;
  background:var(--tint,#fff);
  box-shadow:
    0 3px 10px rgba(40,50,90,.10),
    0 0 16px var(--card-glow);
  opacity:0;
  transition:opacity .22s ease;
}
.card-inner.live{ opacity:1; }

.card.gone .card-inner{
  opacity:0 !important;
  transform:scale(.82) !important;
  transition:opacity .6s ease var(--gone-delay,0ms),
             transform .6s ease var(--gone-delay,0ms);
}

.card .head{
  display:flex; align-items:center; gap:5px;
  padding:6px 10px 5px;
  font-size:var(--head-fs,10px);
  color:var(--head-ink);
  background:linear-gradient(180deg,
              rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 100%);
  border-bottom:1px solid rgba(0,0,0,.055);
  flex:none;
}
.card .head .emoji{ font-size:calc(var(--head-fs,10px) + 2px); line-height:1; }
.card .head .head-text{ letter-spacing:1px; font-weight:500; }

.card .body{
  flex:1;
  display:flex; align-items:center; justify-content:center;
  padding:8px 10px 10px;
  font-size:var(--body-fs,15px);
  font-weight:800;
  color:var(--ink);
  text-align:center;
  line-height:1.35;
  letter-spacing:.5px;
  word-break:break-all;
  overflow:hidden;
}
.card .body.has-photo{ padding:7px; }
.card .body.has-photo img{
  width:100%; height:100%;
  object-fit:cover; border-radius:8px; display:block;
}

.card .body .sk{
  width:80%;
  display:flex; flex-direction:column; gap:7px; align-items:center;
}
.card .body .sk i{
  display:block; height:9px; border-radius:6px;
  background:#e3e4ea;
}
.card .body .sk i:first-child{ width:100%; }
.card .body .sk i:last-child { width:56%;  }

.t0{ --tint:#ffffff; }
.t1{ --tint:#fdf6ef; }
.t2{ --tint:#fbf0f4; }
.t3{ --tint:#eef4fb; }
.t4{ --tint:#f0f8f3; }
.t5{ --tint:#f8f0fb; }
.t6{ --tint:#fbf8ee; }
.t7{ --tint:#f4f2fb; }

#transitionOverlay{
  position:fixed; inset:0;
  pointer-events:none;
  z-index:500;
}
.trans-ring{
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(243,148,173,.5);
  will-change:transform,opacity;
  animation:ringExpand 1.05s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes ringExpand{
  from{ transform:scale(0);   opacity:.9; }
  to  { transform:scale(3.2); opacity:0;  }
}
.trans-flash{
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%,
              rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 62%);
  will-change:opacity;
  animation:flash .9s ease forwards;
}
@keyframes flash{
  0%{ opacity:0; } 30%{ opacity:.8; } 100%{ opacity:0; }
}

@media (max-width:480px){
  #startSubtitle{ max-width:86%; }
}
</style>
</head>

<body>

  <section id="startScreen" class="screen">
    <h1 id="startTitle">洁洁😖😖</h1>
    <p id="startSubtitle">洁洁俺又瞎捣鼓弄这个，这个叫什么来着？好像叫时续续播放🙂🤔</p>
    <button id="startBtn" type="button">开始体验</button>
  </section>

  <section id="stage" class="screen hidden">
    <div id="glowBurst"></div>
    <div id="cardLayer"></div>
  </section>

  <div id="transitionOverlay"></div>

  <audio id="bgMusic" loop preload="auto"></audio>

<script>
'use strict';

const CONFIG = {
  musicSrc: 'heart-cards-bgm.mp3',
  musicVolume: 0.9,
  messages: [
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', ''
  ],
  photos: [
    null, null, null, null, null,
    null, null, null, null, null,
    null, null, null, null, null,
    null, null, null, null, null
  ],
  useDemoText: true,
  roundsToFill: 3,
  cardInterval: 620,
  flyDuration: 850,
  convergeDelay: 1200,
  convergeDuration: 700,
  explodeDelayMin: 1900,
  explodeDelayMax: 2300,
  scatterHold: 4200,
  nextRoundGap: 900
};

const DEMO_TEXT = [
  '记得多喝水哦', '保持好心情,', '梦想成真', '别太累啦,偶\n尔偷懒也好', '顺顺利利',
  '早点休息,', '别熬夜', '记得好好护肤', '你超棒的', '记得吃水果',
  '要相信自己奥', '天冷了,多穿\n衣服', '愿所有烦恼都\n消失', '我想你了', '好好爱自己',
  '今天过得开心\n嘛', '珍惜每一刻', '金榜题名', '期待下一次见\n面,', '每天都要元气\n满满'
];

const rand    = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp   = (v, a, b) => Math.max(a, Math.min(b, v));
const pick    = arr => arr[Math.floor(Math.random() * arr.length)];

function nextFrame(fn){
  requestAnimationFrame(() => requestAnimationFrame(fn));
}

const TimerPool = {
  ids: [],
  set(fn, ms){ const id = setTimeout(fn, ms); this.ids.push(id); return id; },
  clearAll(){ this.ids.forEach(clearTimeout); this.ids.length = 0; }
};

const BGM = {
  el: null,
  started: false,

  init(){
    this.el = document.getElementById('bgMusic');
    this.el.src = CONFIG.musicSrc;
    this.el.loop = true;
    this.el.preload = 'auto';
  },

  start(){
    if (this.started) return;
    this.started = true;
    const el = this.el;
    el.volume = 0;

    const doPlay = () => {
      el.play().then(() => this._fadeIn()).catch(() => {
        const retry = () => {
          el.play().then(() => this._fadeIn()).catch(() => {});
          document.removeEventListener('pointerdown', retry);
          document.removeEventListener('keydown', retry);
        };
        document.addEventListener('pointerdown', retry);
        document.addEventListener('keydown', retry);
      });
    };
    doPlay();
  },

  _fadeIn(){
    const el = this.el;
    const t0 = performance.now();
    const tick = () => {
      const k = clamp((performance.now() - t0) / 1500, 0, 1);
      el.volume = CONFIG.musicVolume * k;
      if (k < 1) requestAnimationFrame(tick);
    };
    tick();
  }
};

const Layout = {
  W: 0, H: 0, S: 16, cx: 0, cy: 0,
  cardW: 130, cardH: 86,
  slots: [],

  heartPoint(t){
    return {
      x: 16 * Math.pow(Math.sin(t), 3),
      y: 13 * Math.cos(t) - 5 * Math.cos(2*t)
          - 2 * Math.cos(3*t) - Math.cos(4*t)
    };
  },

  measure(){
    this.W = window.innerWidth;
    this.H = window.innerHeight;
    this.S = Math.min(this.W * 0.88 / 32, this.H * 0.70 / 29);
    this.cx = this.W / 2;
    this.cy = this.H / 2 - this.S * 1.2;
    this.cardW = clamp(this.S * 8.6, 78, 150);
    this.cardH = this.cardW * 0.66;
  },

  buildSlots(n){
    this.slots.length = 0;
    for (let i = 0; i < n; i++){
      const t  = (i / n) * Math.PI * 2;
      const p  = this.heartPoint(t);
      const jx = rand(-0.5, 0.5) * this.S * 0.6;
      const jy = rand(-0.5, 0.5) * this.S * 0.6;
      this.slots.push({
        x:   this.cx + p.x * this.S - this.cardW / 2 + jx,
        y:   this.cy - p.y * this.S - this.cardH / 2 + jy,
        rot: rand(-7, 7)
      });
    }
    return this.slots;
  }
};

function edgePoint(){
  const side = randInt(0, 3);
  const m    = rand(70, 240);
  const W = Layout.W, H = Layout.H;
  const cw = Layout.cardW, ch = Layout.cardH;
  if (side === 0) return { x: -cw - m,   y: rand(0, Math.max(1, H - ch)), rot: rand(-28, -8) };
  if (side === 1) return { x: W + m,     y: rand(0, Math.max(1, H - ch)), rot: rand(8, 28) };
  if (side === 2) return { x: rand(0, Math.max(1, W - cw)), y: -ch - m,  rot: rand(-22, 22) };
  return           { x: rand(0, Math.max(1, W - cw)), y: H + m,          rot: rand(-22, 22) };
}

let CARD_UID = 0;

class Card{
  constructor(contentIndex){
    this.uid   = CARD_UID++;
    this.ci    = contentIndex;
    this.slot  = -1;
    this.placed = false;

    this.el = document.createElement('div');
    this.el.className = 'card t' + (contentIndex % 8);

    this.inner = document.createElement('div');
    this.inner.className = 'card-inner';

    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = '<span class="emoji">💝</span><span class="head-text">提示</span>';

    const body = document.createElement('div');
    body.className = 'body';
    const photo = CONFIG.photos[contentIndex];
    const text  = CONFIG.useDemoText
                  ? DEMO_TEXT[contentIndex % DEMO_TEXT.length]
                  : (CONFIG.messages[contentIndex] || '');
    if (photo){
      body.classList.add('has-photo');
      const img = document.createElement('img');
      img.src = photo; img.alt = '';
      body.appendChild(img);
    } else if (text){
      body.textContent = text;
    } else {
      body.innerHTML = '<div class="sk"><i></i><i></i></div>';
    }

    this.inner.appendChild(head);
    this.inner.appendChild(body);
    this.el.appendChild(this.inner);
  }

  applySize(w, h){
    this.el.style.width  = w + 'px';
    this.el.style.height = h + 'px';
    this.el.style.setProperty('--body-fs', clamp(Math.round(w * 0.115), 10, 17) + 'px');
    this.el.style.setProperty('--head-fs', clamp(Math.round(w * 0.078), 8, 11)  + 'px');
  }

  setTransform(x, y, rot, scale){
    this.el.style.transform =
      'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + rot + 'deg) scale(' + scale + ')';
  }

  launch(edge, slot, dur){
    this.el.style.transition = 'none';
    this.setTransform(edge.x, edge.y, edge.rot, 0.55);
    nextFrame(() => {
      this.inner.classList.add('live');
      this.el.style.transition = '';
      this.el.style.setProperty('--fly-dur', dur + 'ms');
      this.setTransform(slot.x, slot.y, slot.rot, 1);
    });
  }

  flyTo(x, y, rot, scale, dur, delay){
    this.el.style.setProperty('--fly-dur',   dur   + 'ms');
    this.el.style.setProperty('--fly-delay', delay + 'ms');
    this.setTransform(x, y, rot, scale);
  }

  clearDelay(){
    this.el.style.setProperty('--fly-delay', '0ms');
  }

  gone(delay){
    this.el.style.setProperty('--gone-delay', delay + 'ms');
    this.el.classList.add('gone');
  }

  destroy(){ this.el.remove(); }
}

function boomAt(x, y){
  const burst = document.getElementById('glowBurst');
  const size  = Math.min(Layout.W, Layout.H) * 0.55;
  burst.style.width  = size + 'px';
  burst.style.height = size + 'px';
  burst.style.left   = (x - size / 2) + 'px';
  burst.style.top    = (y - size / 2) + 'px';
  burst.classList.remove('on');
  void burst.offsetWidth;
  burst.classList.add('on');

  const layer = document.getElementById('cardLayer');
  for (let i = 0; i < 12; i++){
    const sp = document.createElement('span');
    sp.className = 'heart-spark';
    sp.textContent = pick(['💗', '💕', '🩷', '💥']);
    const ang  = rand(0, Math.PI * 2);
    const dist = rand(110, 280);
    sp.style.left = x + 'px';
    sp.style.top  = y + 'px';
    sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    sp.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    sp.style.animationDelay = rand(0, 120) + 'ms';
    layer.appendChild(sp);
    setTimeout(() => sp.remove(), 1400);
  }
}

function planScatter(count){
  const m = 6, pts = [];
  const minDist = Layout.cardW * 0.5;
  for (let i = 0; i < count; i++){
    let best = null, bestScore = -1;
    for (let a = 0; a < 10; a++){
      const x = rand(m, Math.max(m + 1, Layout.W - Layout.cardW - m));
      const y = rand(m, Math.max(m + 1, Layout.H - Layout.cardH - m));
      let d = 1e9;
      for (const p of pts) d = Math.min(d, Math.hypot(p.x - x, p.y - y));
      if (pts.length === 0) d = 1e9;
      if (d > minDist){ best = { x, y }; break; }
      if (d > bestScore){ bestScore = d; best = { x, y }; }
    }
    pts.push(best);
  }
  return pts;
}

const Phase = {
  START:'start', ASSEMBLE:'assemble', HOLD:'hold',
  CONVERGE:'converge', FUSE:'fuse', SCATTER:'scatter', FADE:'fade'
};

const State = {
  phase: Phase.START,
  slotIndex: 0,
  round: 1,
  totalSlots: 0,
  cards: []
};

function startExperience(){
  document.getElementById('startBtn').classList.add('disabled');

  const ov = document.getElementById('transitionOverlay');
  const flash = document.createElement('div');
  flash.className = 'trans-flash';
  ov.appendChild(flash);
  setTimeout(() => flash.remove(), 1000);
  for (let i = 0; i < 3; i++){
    setTimeout(() => {
      const ring = document.createElement('div');
      ring.className = 'trans-ring';
      const size = Math.min(window.innerWidth, window.innerHeight) * 0.5;
      ring.style.width  = size + 'px';
      ring.style.height = size + 'px';
      ring.style.left   = (window.innerWidth  / 2 - size / 2) + 'px';
      ring.style.top    = (window.innerHeight / 2 - size / 2) + 'px';
      ov.appendChild(ring);
      setTimeout(() => ring.remove(), 1200);
    }, i * 180);
  }

  document.getElementById('startScreen').classList.add('hidden');

  setTimeout(() => {
    document.getElementById('stage').classList.remove('hidden');
    Layout.measure();
    State.totalSlots = CONFIG.messages.length * CONFIG.roundsToFill;
    Layout.buildSlots(State.totalSlots);
    State.phase = Phase.ASSEMBLE;
    TimerPool.set(spawnNext, 700);
  }, 950);
}

function spawnNext(){
  if (State.phase !== Phase.ASSEMBLE) return;

  const i = State.slotIndex;
  const card = new Card(i % CONFIG.messages.length);
  card.applySize(Layout.cardW, Layout.cardH);
  document.getElementById('cardLayer').appendChild(card.el);
  State.cards.push(card);

  const slot = Layout.slots[i];
  card.slot = i;
  card.launch(edgePoint(), slot, CONFIG.flyDuration);
  TimerPool.set(() => {
    card.placed = true;
    card.clearDelay();
    // 第一个卡片落入位置后才播放背景音乐
    if (i === 0) BGM.start();
  }, CONFIG.flyDuration + 60);

  State.slotIndex++;

  if (State.slotIndex < State.totalSlots){
    TimerPool.set(spawnNext, CONFIG.cardInterval);
  } else {
    State.phase = Phase.HOLD;
    TimerPool.set(beginConverge, CONFIG.flyDuration + CONFIG.convergeDelay);
  }
}

function beginConverge(){
  if (State.phase !== Phase.HOLD) return;
  State.phase = Phase.CONVERGE;

  const target = Layout.slots[State.totalSlots - 1];
  const n = State.cards.length;

  State.cards.forEach((c, idx) => {
    const jx = rand(-5, 5);
    const jy = rand(-4, 4);
    const isLast = (idx === n - 1);
    c.flyTo(
      target.x + jx,
      target.y + jy,
      isLast ? target.rot : rand(-4, 4),
      isLast ? 1 : 0.9,
      CONFIG.convergeDuration,
      idx * 8
    );
    TimerPool.set(() => c.clearDelay(),
                  CONFIG.convergeDuration + idx * 8 + 60);
  });

  const totalFly = CONFIG.convergeDuration + n * 8;
  State.phase = Phase.FUSE;

  const wait = rand(CONFIG.explodeDelayMin, CONFIG.explodeDelayMax);
  TimerPool.set(() => explode(target), totalFly + wait);
}

function explode(target){
  if (State.phase !== Phase.FUSE) return;
  State.phase = Phase.SCATTER;

  boomAt(target.x + Layout.cardW / 2, target.y + Layout.cardH / 2);

  const pts = planScatter(State.cards.length);
  let maxEnd = 0;

  State.cards.forEach((c, idx) => {
    const p     = pts[idx];
    const rot   = rand(-18, 18);
    const scale = rand(1.0, 1.5);
    const dur   = rand(520, 900);
    const delay = rand(0, 140);
    c.el.style.zIndex = randInt(1, 200);
    c.flyTo(p.x, p.y, rot, scale, dur, delay);
    maxEnd = Math.max(maxEnd, dur + delay);
    TimerPool.set(() => c.clearDelay(), dur + delay + 60);
  });

  TimerPool.set(() => {
    // 散是满天星后等8秒，跳转到微信二维码页面
    try {
      window.parent.postMessage({ type: 'HEART_CARDS_DONE' }, '*');
    } catch (e) {}
  }, maxEnd + 8000);
}

function goFade(){
  if (State.phase !== Phase.SCATTER) return;
  State.phase = Phase.FADE;

  const n = State.cards.length;
  State.cards.forEach((c, idx) => c.gone(idx * 10));

  TimerPool.set(() => {
    State.cards.forEach(c => c.destroy());
    State.cards.length = 0;
    State.slotIndex = 0;
    State.round++;
    Layout.measure();
    Layout.buildSlots(State.totalSlots);
    State.phase = Phase.ASSEMBLE;
    TimerPool.set(spawnNext, CONFIG.nextRoundGap);
  }, 700 + n * 10 + 150);
}

window.addEventListener('resize', () => {
  Layout.measure();
  if (State.totalSlots) Layout.buildSlots(State.totalSlots);
  if (State.phase === Phase.ASSEMBLE || State.phase === Phase.HOLD){
    State.cards.forEach(c => {
      if (c.placed && c.slot >= 0){
        const s = Layout.slots[c.slot];
        c.el.style.transition = 'none';
        c.setTransform(s.x, s.y, s.rot, 1);
        nextFrame(() => { c.el.style.transition = ''; });
      }
    });
  }
});

BGM.init();
document.getElementById('startBtn').addEventListener('click', startExperience);

window.__JJ = { CONFIG, State, Layout, BGM };
</script>
</body>
</html>
